services:
  - type: web
    name: configsentinel-backend
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn src.api.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: MAPPINGS_DB_PATH
        value: /var/data/mappings.db
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: "gpt-4"
      - key: AI_BASE_URL
        value: "https://api.openai.com/v1"
    disk:
      name: configsentinel-data
      mountPath: /var/data
      sizeGB: 1
