/* Juniper Junos — Secure (All Controls Passing) Demo Fixture */
system {
    host-name SECURE-JUNIPER-01;
    services {
        ssh {
            protocol-version v2;
            ciphers [ aes256-gcm@openssh.com aes128-gcm@openssh.com ];
        }
        netconf {
            ssh;
        }
    }
    syslog {
        host 10.0.0.50 {
            any notice;
        }
    }
    ntp {
        server 10.0.0.1;
    }
    login {
        message "AUTHORIZED USERS ONLY";
    }
}
snmp {
    community public {
        authorization read-only;
    }
}
