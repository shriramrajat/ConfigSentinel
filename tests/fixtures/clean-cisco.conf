! Cisco IOS — Secure (All Controls Passing) Demo Fixture
! ConfigSentinel Phase 0 Demo: clean-cisco.conf
! This config satisfies all 13 compliance controls.

hostname SECURE-ROUTER-01

! SSH version 2 only
ip ssh version 2
ip ssh authentication-retries 3

! No Telnet on VTY lines
! Logging to syslog server
logging host 10.0.0.100
logging trap informational

! NTP server
ntp server 10.0.0.200
ntp authenticate

! Clock timezone
clock timezone UTC 0

! No HTTP server (default off, explicit)
no ip http server
ip http secure-server

! SNMP — no default communities
no snmp-server community public
no snmp-server community private
snmp-server group SNMPV3GROUP v3 priv

! Password encryption
service password-encryption

! Login banner
banner login ^
AUTHORIZED ACCESS ONLY.
Unauthorized access is strictly prohibited and monitored.
^

! AAA new-model
aaa new-model
aaa authentication login default local
aaa authorization exec default local

! Exec timeout on all lines
line vty 0 4
 transport input ssh
 exec-timeout 10 0
 login authentication default

line console 0
 exec-timeout 5 0

! Disable unnecessary services
no service finger
no service tcp-small-servers
no service udp-small-servers
no ip source-route

end
